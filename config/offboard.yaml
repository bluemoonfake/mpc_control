reference_generator_node:
  ros__parameters:
    # Follow measured position/yaw before Offboard, then freeze at the rising edge.
    auto_capture_current_hold: true

px4_torque_thrust_setpoint_node:
  ros__parameters:
    # Direct torque/thrust inner loop.
    publish_rate_hz: 250.0
    heartbeat_rate_hz: 10.0
    # Input freshness limits.
    state_timeout_seconds: 0.25
    command_timeout_seconds: 0.25
    timesync_timeout_seconds: 1.5
    hover_thrust_estimate_timeout_seconds: 5.0
    # Rate-limited HTE tracking avoids thrust steps.
    hover_thrust_tracking_time_constant_seconds: 2.0
    hover_thrust_max_rate_per_second: 0.02
    vehicle_mass: 2.0
    gravity: 9.80665
    # Fallback used only when PX4 HTE is unavailable.
    hover_thrust_normalized: 0.60
    # Geometric SO(3) feedback and desired-rate estimation.
    attitude_gain: [0.8, 0.8, 0.4]
    rate_gain: [0.15, 0.15, 0.10]
    enable_desired_rate_tracking: true
    desired_kinematics_filter_time_constant_seconds: 0.05
    desired_kinematics_max_sample_interval_seconds: 0.10
    max_desired_body_rate_rad_s: [2.0, 2.0, 1.0]
    max_desired_body_acceleration_rad_s2: [10.0, 10.0, 5.0]
    # Enable only after identifying normalized inertia/torque scale.
    enable_dynamics_compensation: false
    normalized_inertia: [0.0, 0.0, 0.0]
    normalized_torque_limit: [0.30, 0.30, 0.20]

mpc_controller_node:
  ros__parameters:
    # Optional validation and collective-force projection.
    strict_validation: false
    enable_thrust_feasibility: false
    use_force_norm_for_collective_thrust: true

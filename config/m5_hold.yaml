reference_generator_node:
  ros__parameters:
    trajectory_type: hold
    frame_id: map
    hold_position: [0.0, 0.0, 0.0]
    hold_yaw_rad: 0.0
    hold_current_state_on_enable: true
    horizon_seconds: 30.0
    sample_period_seconds: 0.1
    publish_rate_hz: 1.0

vehicle_state_bridge_node:
  ros__parameters:
    state_timeout_seconds: 0.25
    max_sample_skew_seconds: 0.10
    publish_rate_hz: 50.0

mpc_controller_node:
  ros__parameters:
    update_rate_hz: 50.0
    reference_timeout_seconds: 1.5
    state_timeout_seconds: 0.25
    dt_first: 0.01
    dt_later: 0.20
    max_iterations: 45
    solver_verbose: false
    q_xy: [500.0, 100.0, 100.0]
    s_xy: [1000.0, 300.0, 300.0]
    q_z: [100.0, 10.0, 10.0]
    s_z: [100.0, 10.0, 10.0]
    max_speed_xy: 2.0
    max_control_xy: 2.0
    max_control_rate_xy: 5.0
    max_speed_z: 2.0
    max_acceleration_z: 2.0
    max_control_z: 50.0
    max_control_rate_z: 999.0
    vehicle_mass: 2.0
    inertia_xx: 0.02166666666666667
    inertia_yy: 0.02166666666666667
    inertia_zz: 0.04000000000000001
    gravity: 9.80665
    attitude_gain_roll_pitch: 5.0
    attitude_gain_yaw: 1.0
    rate_gain_roll_pitch: 4.0
    rate_gain_yaw: 4.0
    normalized_rate_gain_roll_pitch: 0.15
    normalized_rate_gain_yaw: 0.20
    max_normalized_torque_roll: 1.0
    max_normalized_torque_pitch: 1.0
    max_normalized_torque_yaw: 1.0
    max_roll_rate: 4.0
    max_pitch_rate: 4.0
    max_yaw_rate: 4.0
    max_tilt: 0.7853981633974483

px4_wrench_bridge_node:
  ros__parameters:
    vehicle_mass: 2.0
    gravity: 9.80665
    # Rounded stock-PX4 gz_x500 hover boundary measured from the pinned ULog.
    px4_hover_thrust_normalized: 0.765
    publish_rate_hz: 50.0
    heartbeat_rate_hz: 10.0
    command_timeout_seconds: 0.25
    timesync_timeout_seconds: 1.5

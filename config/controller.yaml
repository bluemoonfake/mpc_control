reference_generator_node:
  ros__parameters:
    # manual_velocity: joystick; trajectory: ReferenceStep/line/circle.
    reference_input_mode: manual_velocity
    frame_id: map
    hold_position: [0.0, 0.0, 0.0]
    hold_yaw_rad: 0.0
    line_relative_delta: [2.0, 0.0, 0.0]
    line_duration_seconds: 12.0
    # Period and ramp are derived from radius, speed and acceleration limits.
    circle_radius: 30.0
    circle_reference_speed_limit_m_s: 4.0
    circle_acceleration_limit_m_s2: 1.5
    circle_direction: 1
    state_timeout_seconds: 0.25
    horizon_seconds: 30.0
    sample_period_seconds: 0.1
    publish_rate_hz: 1.0
    # RViz: joystick green, safe reference red, MPC prediction cyan.
    visualization_enabled: true
    visualization_publish_rate_hz: 20.0
    visualization_arrow_length_m: 1.0
    visualization_direction_deadband: 0.08
    manual_input_timeout_seconds: 0.25
    manual_update_rate_hz: 25.0
    manual_stick_deadband: 0.08
    manual_max_horizontal_speed_m_s: 2.0
    manual_max_vertical_speed_m_s: 1.0
    manual_max_horizontal_acceleration_m_s2: 1.5
    manual_max_vertical_acceleration_m_s2: 1.0
    manual_max_yaw_rate_rad_s: 0.8
    manual_max_horizontal_position_error_m: 2.0
    manual_max_vertical_position_error_m: 1.0
    visualization_max_prediction_points: 50

vehicle_state_bridge_node:
  ros__parameters:
    state_timeout_seconds: 0.25
    max_sample_skew_seconds: 0.10
    publish_rate_hz: 50.0

mpc_controller_node:
  ros__parameters:
    update_rate_hz: 50.0
    reference_timeout_seconds: 1.5
    state_timeout_seconds: 0.25
    # Nonuniform shooting grid: short first step, longer prediction steps.
    dt_first: 0.01
    dt_later: 0.20
    max_iterations: 400
    # Zero alpha/time constant selects the direct acceleration model.
    model_alpha_xyz: [0.0, 0.0, 0.0]
    model_time_constant_xyz: [0.0, 0.0, 0.0]
    # ADMM solver settings.
    admm_rho: 0.05
    solver_absolute_tolerance: 0.001
    solver_relative_tolerance: 0.001
    # Stage and terminal weights ordered [position, velocity, acceleration].
    q_xy: [700.0, 1000.0, 100.0]
    s_xy: [1000.0, 600.0, 300.0]
    q_z: [100.0, 200.0, 10.0]
    s_z: [100.0, 200.0, 10.0]
    # Optional force feedback [X, Y, Z].
    force_feedback_kp_n_per_m: [0.0, 0.0, 0.6]
    force_feedback_kv_n_per_m_s: [0.0, 0.0, 0.0]
    max_speed_xy: 5.0
    max_control_xy: 5.0
    max_control_rate_xy: 5.0
    max_speed_z: 5.0
    max_acceleration_z: 5.0
    max_measured_acceleration_z_m_s2: 10.0
    max_control_z: 5.0
    max_control_rate_z: 5.0
    vehicle_mass: 2.0
    gravity: 9.80665
    hover_thrust_normalized: 0.765
    max_normalized_collective_thrust: 1.0
    max_tilt: 1.5707963267948966
